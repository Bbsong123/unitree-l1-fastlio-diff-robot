# L2 使用官方 SDK2 UDP 接口；网卡 IP/路由由用户在系统中配置。
# 本文件仅告知驱动通信地址，不修改任何系统网络设置。
initialize_type: 2          # 2=UDP
work_mode: 0                # 标准 FOV、3D、开启 IMU、网口、上电自转
use_system_timestamp: true  # 沿用官方主机时钟方案；实机需检查点云/IMU时间差
range_min: 0.0              # 米；FAST-LIO 另有 blind 距离过滤
range_max: 100.0
cloud_scan_num: 18          # SDK 聚合扫描数量，沿用官方默认，不是物理多线雷达线数

# 必须与实物和系统网卡设置一致；下面为官方默认配置。
lidar_port: 6101
lidar_ip: "192.168.1.62"
pc_port: 6201
pc_ip: "192.168.1.2"

# 沿用原话题，FAST-LIO 直接订阅，无格式转换节点。
cloud_frame: "unilidar_lidar"
cloud_topic: "/unilidar/cloud"
# FAST-LIO 的 body 就是雷达内置 IMU 系，直接使用同一 frame 名。
imu_frame: "body"
imu_topic: "/unilidar/imu"

# 官方驱动保留 2D 接口，当前 work_mode=0 不使用该输出。
laserscan_frame: "unilidar_lidar"
laserscan_topic: "/unilidar/laserscan"
