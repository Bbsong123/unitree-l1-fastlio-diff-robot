# ==============================================================================
# 机器人传感器物理安装外参配置 (Static TF)
# 描述: 激光雷达坐标系 (unilidar_lidar) 相对 小车旋转中心 (base_link) 的空间相对变换
# 说明: 当前默认已全填 0.0，后续用皮尺测量实际毫米数据后直接在此修改保存，无需改动任何代码
# ==============================================================================

parent_frame: "base_link"
child_frame: "unilidar_lidar"

# 空间平移偏差 (单位: 米)
translation:
  x: 0.0      # 前后偏移: 雷达在底盘中心前方为正，后方为负
  y: 0.0      # 左右偏移: 雷达在底盘中心左侧为正，右侧为负
  z: 0.0      # 垂直高度: 雷达中心相对于底盘 base_link 平面的高度

# 姿态角度偏差 (欧拉角，单位: 弧度)
rotation:
  roll: 0.0   # 横滚角 (绕 X 轴旋转)
  pitch: 0.0  # 俯仰角 (绕 Y 轴旋转)
  yaw: 0.0    # 偏航角 (绕 Z 轴旋转，雷达正前方与车头朝向一致则为 0)
